version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: seatq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatq
      POSTGRES_PASSWORD: seatq_dev_password
      POSTGRES_DB: seatq
    ports:
      - "5432:5432"
    volumes:
      - seatq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  seatq_pg_data:
